<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会议执行进度看板 · 跳转中</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}
h2{font-size:20px;margin:0 0 8px}
p{font-size:14px;color:#94a3b8;margin:0}
a{color:#60a5fa}
</style>
</head>
<body>
<div>
<h2>正在跳转...</h2>
<p>如未自动跳转请点<a id="fallback" href="#">这里</a></p>
</div>
<script>
// 永久跳转入口 — 存放于 GitHub Pages (https://zhany950.github.io/meeting-progress/go.html)
// 每次 CloudStudio 重新部署后，主看板自动将新域名写入 jsonblob meta.currentUrl
// 此页面读取 jsonblob → 跳转到最新部署链接
const FALLBACK = 'https://c57ecd7c163e4f949883fe467a8840da.sh3.agentos-app.net';
const API = 'https://jsonblob.com/api/jsonBlob/019fe921-14fa-716a-92c8-327fb39b2d0d';

document.getElementById('fallback').href = FALLBACK;

(async function(){
  try{
    const res = await fetch(API, {headers:{'Accept':'application/json'}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const url = (data && data.meta && data.meta.currentUrl) || '';
    if(url && !url.startsWith('file://') && url.startsWith('http')){
      window.location.replace(url);
      return;
    }
  } catch(e) {}
  // 云端不可达 → 使用硬编码回退
  window.location.replace(FALLBACK);
})();
</script>
</body>
</html>
