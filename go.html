<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会议执行进度看板 · 跳转中</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}
h2{font-size:20px;margin:0 0 8px}
p{font-size:14px;color:#94a3b8;margin:0}
a{color:#60a5fa}
</style>
</head>
<body>
<div>
<h2>正在跳转...</h2>
<p>如未自动跳转请点<a id="fb" href="#">这里</a></p>
</div>
<script>
// 永久跳转入口 — 存放于 GitHub Pages
// 优先使用 GitHub Pages（微信可访问），jsonblob 作为动态更新源
const GH = 'https://zhany950.github.io/meeting-progress/';
const API = 'https://jsonblob.com/api/jsonBlob/019fe921-14fa-716a-92c8-327fb39b2d0d';

document.getElementById('fb').href = GH;

(async function(){
  try{
    const res = await fetch(API, {headers:{'Accept':'application/json'}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const url = (data && data.meta && data.meta.currentUrl) || '';
    // 仅当云端URL是http/https且不是agentos-app.net(微信封禁)时才使用
    if(url && url.startsWith('http') && !url.includes('agentos-app.net')){
      window.location.replace(url);
      return;
    }
  } catch(e) {}
  // 兜底：直接跳 GitHub Pages（微信可访问、永久不变）
  window.location.replace(GH);
})();
</script>
</body>
</html>
