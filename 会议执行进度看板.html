    html += '<b style="font-size:13px">📌 策略 · 会议有效性</b> — 按策略分组查看会议，逐场展开查看每位参会客户的纯销进展<br>';
    html += '口径：<b>会前周均</b>=会前28天纯销÷4；<b>W1~W4</b>=会后第N周(7天)纯销合计；<b>满4周后显示会后周均</b>=会后28天纯销÷4；未到的周自动留空<br>';
    html += '颜色：<b style="color:#188038">绿↑=增长</b>　<b style="color:#d93025">红↓=下降</b>　<b style="color:var(--amber)">黄→=维稳</b><br>';
    html += '客户表 <b>DM / 标签</b> 取自瞄准镜（仅 5 位 DM；标签优先级 244 &gt; List &gt; 空白）；同名医生优先按医院区分，无法唯一确定时留空</div>';
  }
  // ---- 手动添加表单 ----
  html += '<div id="effForm" style="display:' + (_effFormOpen?'block':'none') + ';background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px">';
  html += '<div style="display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:10px">';
  html += '<div><label style="font-size:11px;color:var(--text2)">会议名称</label><input id="effName" placeholder="如：苏南头痛头晕规范化诊疗研讨会" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px"></div>';
  html += '<div><label style="font-size:11px;color:var(--text2)">会议日期</label><input id="effDate" type="date" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px"></div></div>';
  html += '<label style="font-size:11px;color:var(--text2)">参会客户名单（每行一个或逗号分隔）</label>';
  html += '<textarea id="effNames" rows="4" placeholder="赵红如&#10;王达鹏&#10;蔡可夫..." style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px;margin-bottom:10px;font-family:var(--font)"></textarea>';
  html += '<div style="display:flex;gap:8px"><button class="btn" onclick="effSubmit()">开始分析</button><button class="btn" style="background:var(--bg)" onclick="effToggleForm()">取消</button></div></div>';

  if(mode === 'strategy'){
    if(!state.meetings.length){
      html += '<div class="strategy-empty">暂无会议数据</div>';
      return html;
    }
    // 策略页不按日期/状态筛选：只要 strategy 非空都纳入
    const byCat = {}; STRATEGY_NONEMPTY.forEach(x=>byCat[x]=[]);
    state.meetings.forEach(m=>{
      const cat = m.strategy;
      if(!cat) return;                 // 未分类不进策略页
      if(!byCat[cat]) byCat[cat] = []; // 兼容历史自定义值
      byCat[cat].push({m, date:m.date||m.startDate||'', dm:(Array.isArray(m.dm)?m.dm.join('、'):m.dm)||''});
    });
    const cats = STRATEGY_NONEMPTY.concat(Object.keys(byCat).filter(k=>STRATEGY_NONEMPTY.indexOf(k)<0));
    cats.forEach(c=>{
      (byCat[c]||[]).sort((x,y)=>{
        const da = x.date||'9999-12-31', db = y.date||'9999-12-31';
        return da.localeCompare(db);
      });
    });
    let groups = '', totalMtg = 0;
    cats.forEach(cat=>{
      const list = byCat[cat];
      if(!list || !list.length) return;
      totalMtg += list.length;
      const ci = strategyIdx(cat);
      const open = _stratOpen[cat] !== false;     // 默认展开
      groups += '<div class="strategy-section">';
      groups += '<div class="strategy-title" style="cursor:pointer;user-select:none" onclick="toggleStratGroup(\''+es(cat)+'\')" title="'+(open?'收起该策略':'展开该策略')+'">';
      groups += '<span style="display:inline-block;width:14px;color:var(--text3);font-size:11px">'+(open?'▼':'▶')+'</span>';
      groups += '<span class="tag st-c'+ci+' st-wrap">'+es(cat)+'</span>';
      groups += '<span style="color:var(--text3);font-size:12px">'+list.length+'场</span></div>';
      if(open){
        groups += '<table class="strategy-table"><thead><tr><th style="width:28px"></th><th>会议</th><th>负责DM</th><th>机制</th><th>日期/时间</th><th>进展</th><th>状态</th><th>有效性汇总</th></tr></thead><tbody>';
        list.forEach(row=>{
          const m = row.m;
          const isOpen = _mtgOpen[m.uid] === true;   // 默认收起
          const p = getProgress(m);
          const statusTag = m.status==='已完成'?'tag-done':m.status==='进行中'?'tag-ongoing':m.status==='待开展'?'tag-strategy-none':'tag-planning';
          const mi = mechanismIdx(m.mechanism);
          const entry = effEntryForMeeting(m.uid);
          let effCell = '<span style="color:var(--text3);font-size:12px">未同步至会议有效性</span>';
          if(entry){
            if(entry.date && (entry.attendees||[]).length) effCell = effSummaryInline(effComputeSummary(entry));
            else if(!entry.date) effCell = '<span style="color:var(--text3);font-size:12px">会议未设置日期</span>';
            else effCell = '<span style="color:var(--text3);font-size:12px">尚未录入参会客户</span>';
          }
          groups += '<tr style="cursor:pointer" onclick="toggleMtgEff(\''+m.uid+'\')" title="'+(isOpen?'收起有效性明细':'展开有效性明细')+'">';
          groups += '<td style="color:var(--text3);font-size:11px">'+(isOpen?'▼':'▶')+'</td>';
          groups += '<td class="st-name">'+es(m.name)+' <button class="mini-btn" style="font-size:10px;padding:1px 6px" onclick="event.stopPropagation();selectMeetingByUid(\''+m.uid+'\')" title="打开该会议的 SOP 进度详情">打开SOP</button></td>';
          groups += '<td>'+es(row.dm)+'</td>';
          groups += '<td><span class="tag mech-c'+mi+'">'+(m.mechanism?es(m.mechanism):'未分类')+'</span></td>';
          groups += '<td class="st-time">'+es(row.date||'待定')+'</td>';
          groups += '<td>'+p.pct+'% ('+p.done+'/'+p.total+')</td>';
          groups += '<td><span class="tag '+statusTag+'">'+es(m.status||'筹备中')+'</span></td>';
          groups += '<td class="st-eff">'+effCell+'</td>';
          groups += '</tr>';
          if(isOpen){
            groups += '<tr><td colspan="8" style="padding:0;background:var(--bg)">';
            groups += '<div style="padding:12px 14px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)">';
            if(entry) groups += effEntryCard(entry, false);
            else groups += '<div style="color:var(--text3);font-size:12px">该会议暂无有效性记录</div>';
            groups += '</div></td></tr>';
          }
        });
        groups += '</tbody></table>';
      }
      groups += '</div>';
    });
    if(!groups){
      html += '<div class="strategy-empty">暂无带策略标签的会议</div>';
    }else{
      html += groups;
    }
    // ---- 历史未关联会议（旧版预置/手工录入，无 meetingUid）默认收起 ----
    const legacy = (eff.entries||[]).filter(e=>!e.meetingUid);
    if(legacy.length){
      html += '<div class="strategy-section">';
      html += '<div class="strategy-title" style="cursor:pointer;user-select:none" onclick="toggleLegacySection()" title="'+( _legacyOpen?'收起':'展开')+'">';
      html += '<span style="display:inline-block;width:14px;color:var(--text3);font-size:11px">'+(_legacyOpen?'▼':'▶')+'</span>';
      html += '<span class="tag st-c0">历史未关联会议</span>';
      html += '<span style="color:var(--text3);font-size:12px">'+legacy.length+'场（旧版预置/手工录入，未绑定会议 UID）</span></div>';
      if(_legacyOpen){
        legacy.slice().sort((x,y)=>(y.date||'').localeCompare(x.date||'')).forEach(item=>{
          html += '<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px">';
          html += '<div style="font-weight:600;font-size:14px;margin-bottom:6px">'+es(item.name||'')+' <span style="color:var(--text3);font-size:12px;font-weight:400">'+es(item.date||'')+(item.dm?'｜DM:'+es(item.dm):'')+'</span></div>';
          html += effEntryCard(item, false);
          html += '</div>';
        });
      }
      html += '</div>';
    }
    return html;
  }

  // ---- flat：旧版平铺列表（兼容保留）----
  const list = (eff.entries||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!list.length){
    html += '<div class="empty-state"><p>暂无已完成会议的跟进</p><p style="font-size:12px;color:var(--text3)">会议在看板中标记「已完成」或设置策略后自动出现在这里</p></div>';
    return html;
  }
  html += '<h3 style="margin:0 0 12px;font-size:15px">已跟进会议（'+list.length+'场）</h3>';
  list.forEach(item=>{
    const metrics = effComputeSummary(item);
    const srcBadge = item.auto ? '<span class="tag tag-done" style="font-size:10px">看板同步</span>'
      : (item.source ? '<span class="tag" style="font-size:10px;background:var(--bg);color:var(--text2)">预置</span>'
      : '<span class="tag" style="font-size:10px;background:var(--bg);color:var(--text2)">手动</span>');
    const collapsed = !!_effCollapsed[item.id] && (item.attendees||[]).length > 0;
    html += '<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px">';
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px">';
    html += '<div style="cursor:pointer;user-select:none;flex:1" onclick="effToggleCollapse(\''+item.id+'\')"><span style="display:inline-block;width:14px;color:var(--text3);font-size:11px">'+(collapsed?'▶':'▼')+'</span><b style="font-size:14px">'+es(item.name||'')+'</b> '+srcBadge+' <span style="color:var(--text2);font-size:12px;margin-left:6px">'+es(item.date)+(item.dm?'｜DM:'+es(item.dm):'')+(item.city?'｜'+es(item.city):'')+'</span></div>';
    html += '<div style="display:flex;gap:6px"><button class="btn btn-sm" style="font-size:11px;padding:2px 8px" onclick="effPosterBtn(\''+item.id+'\')">📎 上传日程海报</button>';
    html += '<button class="btn btn-sm" style="font-size:11px;padding:2px 8px" onclick="effTableBtn(\''+item.id+'\')">📋 上传日程表格</button>';
    html += '<button class="btn btn-sm" style="font-size:11px;padding:2px 8px;color:var(--red)" onclick="effDelete(\''+item.id+'\')">🗑 删除</button></div></div>';
    html += '<input type="file" id="effPoster_'+item.id+'" accept="image/*" style="display:none" onchange="effPosterPick(\''+item.id+'\',this)">';
    html += '<input type="file" id="effTableFile_'+item.id+'" accept=".xlsx,.xls,.csv" style="display:none" onchange="effTablePick(\''+item.id+'\',this)">';
    if(_effOcr.entryId === item.id){
      html += '<div style="background:var(--bg);border:1px dashed var(--border);border-radius:8px;padding:12px;margin-bottom:10px">';
      html += '<div style="font-size:12px;font-weight:600;margin-bottom:8px">📎 日程海报识别</div>';
      if(_effOcr.img) html += '<img src="'+_effOcr.img+'" style="max-height:220px;max-width:100%;border-radius:6px;margin-bottom:8px;display:block">';
      html += '<div id="effOcrStatus" style="font-size:12px;color:var(--text2);margin-bottom:8px">'+(_effOcr.busy?'识别中，请稍候…':'识别完成，可修正文字后再次提取')+'</div>';
      html += '<textarea id="effOcrText" rows="4" placeholder="海报识别文字（可手动修正）" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:12px;margin-bottom:8px;font-family:var(--font)" oninput="_effOcr.text=this.value">'+es(_effOcr.text)+'</textarea>';
      html += '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sm" onclick="effOcrExtract(\''+item.id+'\')">从文字提取客户并添加</button>';
      html += '<button class="btn btn-sm" style="background:var(--bg)" onclick="_effOcr.entryId=null;effRerender()">关闭</button></div></div>';
    }
    if(_effTable.entryId === item.id){
      html += '<div style="background:var(--bg);border:1px dashed var(--border);border-radius:8px;padding:12px;margin-bottom:10px">';
      html += '<div style="font-size:12px;font-weight:600;margin-bottom:8px">📋 日程表格识别</div>';
      if(_effTable.busy){ html += '<div style="font-size:12px;color:var(--text2)">正在解析表格并匹配客户…</div>'; }
      else{
        if(_effTable.err) html += '<div style="font-size:12px;color:var(--amber);margin-bottom:8px">⚠️ '+es(_effTable.err)+'</div>';
        html += '<div id="effTableStatus" style="font-size:12px;color:var(--text2);margin-bottom:8px">'+(_effTable.matched.length ? '✅ 从表格识别到 <b>'+_effTable.matched.length+'</b> 位患者画像表客户' : '未识别到客户，请手动输入姓名')+'</div>';
        html += '<textarea id="effTableText" rows="4" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:12px;margin-bottom:8px;font-family:var(--font)">'+es(_effTable.matched.join('\n'))+'</textarea>';
        html += '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sm" onclick="effTableApply(\''+item.id+'\')">从名单添加客户</button>';
        html += '<button class="btn btn-sm" style="background:var(--bg)" onclick="_effTable.entryId=null;effRerender()">关闭</button></div>';
      }
      html += '</div>';
    }
    if(!item.date){
      html += '<div style="padding:12px;background:var(--yellow-bg);border:1px solid var(--yellow);border-radius:6px;font-size:12px;color:var(--text2)">⚠️ 该会议尚未设置日期，无法计算会前/会后周均。</div>';
    }else if(!(item.attendees||[]).length){
      html += '<div style="padding:14px;background:var(--bg);border-radius:6px;font-size:12px;color:var(--text2);line-height:1.9">⏳ 尚无参会客户名单 —— 点击「📋 上传日程表格」或「📎 上传日程海报」自动识别客户；也可手动录入：</div>';
      html += '<div style="display:flex;gap:8px;margin-top:8px"><input id="effAdd_'+item.id+'" list="effCustList" placeholder="输入或选择客户姓名，多个用逗号分隔" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px">';
      html += '<button class="btn" onclick="effAddCust(\''+item.id+'\')">添加并分析</button></div>';
    }else{
      html += effSummaryBar(metrics);
      if(!collapsed){
        const a2 = metrics.a, wkTotals = metrics.wkTotals;
        if(metrics.missW.length) html += '<div style="font-size:11px;color:var(--amber);margin-bottom:8px">⚠️ W'+metrics.missW.map(x=>x.n).join('/W')+' 已过但销量数据未覆盖</div>';
        html += '<div style="margin-bottom:10px">'+effBars(metrics.totPre, wkTotals)+'</div>';
        const fv = _effFilter[item.id] || '';
        html += '<div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">';
        html += '<input id="effSearch_'+item.id+'" placeholder="🔍 筛选客户/医院/DM/标签" value="'+es(fv)+'" style="width:200px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px" oninput="effSearch(\''+item.id+'\',this.value)">';
        html += '<input id="effAdd_'+item.id+'" list="effCustList" placeholder="＋ 添加客户" style="width:180px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px">';
        html += '<button class="btn btn-sm" onclick="effAddCust(\''+item.id+'\')">添加</button></div>';
        const sort = _effSort[item.id];
        let rows = a2.rows.map(r=>{ const mt = r.matched ? aimLookup(r.n, r.h) : {dm:'',tag:''}; r.dm = mt.dm||''; r.tag = mt.tag||''; return r; });
        if(fv){ const q = fv.toLowerCase(); rows = rows.filter(r=>r.n.toLowerCase().includes(q)||(r.h||'').toLowerCase().includes(q)||(r.dm||'').toLowerCase().includes(q)||(r.tag||'').toLowerCase().includes(q)); }
        if(sort){
          const key = sort.key, dir = sort.dir;
          rows = rows.slice().sort((x,y)=>{
            const va = effSortVal(x,key), vb = effSortVal(y,key);
            const na = va==null||va==='', nb = vb==null||vb==='';
            if(na && nb) return 0; if(na) return 1; if(nb) return -1;
            if(typeof va === 'string') return dir * va.localeCompare(vb,'zh');
            return dir * (va - vb);
          });
        }
        const th2 = (key,label)=>{
          const cur = sort && sort.key===key;
          const arr = cur ? (sort.dir>0?' ↑':' ↓') : ' ⇅';
          return '<th style="cursor:pointer;user-select:none;white-space:nowrap" onclick="effSort(\''+item.id+'\',\''+key+'\')">'+label+'<span style="font-size:10px;color:'+(cur?'var(--red)':'var(--text3)')+'">'+arr+'</span></th>';
        };
        html += '<div class="table-wrap"><table style="width:100%"><thead><tr>';
        html += th2('name','客户') + th2('h','医院') + th2('dm','DM') + th2('t','分型') + th2('tag','标签');
        html += th2('pre','会前周均(盒)') + th2('post','会后周均(盒)');
        html += th2('w1','W1') + th2('w2','W2') + th2('w3','W3') + th2('w4','W4');
        html += '<th>趋势</th><th>折线</th><th></th></tr></thead><tbody>';
        rows.forEach(r=>{
          html += '<tr><td style="white-space:nowrap">'+es(r.n)+'</td>';
          if(!r.matched){ html += '<td colspan="12" style="color:var(--text-muted)">患者画像表无记录</td>'; }
          else{
            html += '<td style="font-size:11px;color:var(--text2)">'+es(r.h)+'</td>';
            html += '<td>'+aimDmBadge(r.dm)+'</td>';
            html += '<td>'+(r.t?'<span class="tag" style="font-size:10px;background:var(--bg)">'+es(r.t)+'</span>':'')+'</td>';
            html += '<td>'+aimTagBadge(r.tag)+'</td>';
            html += '<td><b>'+effFmt(r.pre)+'</b></td>';
            html += r.post != null ? '<td style="white-space:nowrap"><b style="color:'+effNumColor(r.post,r.pre)+'">'+effFmt(r.post)+'</b>'+effArrow(r.post,r.pre)+'</td>' : '<td></td>';
            for(let n=1;n<=4;n++){
              const wk = a2.weeks[n-1], v = r.w[n];
              if(v != null) html += '<td style="color:'+effNumColor(v,r.pre)+'"><b>'+effFmt(v)+'</b></td>';
              else if(wk.elapsed) html += '<td style="color:var(--text-muted)">—</td>';
              else html += '<td></td>';
            }
            html += '<td style="font-size:11px;white-space:nowrap">'+(r.trend?r.trend.split(' ').map(t=>'<span style="color:'+(t==='▲'?'#188038':t==='▼'?'#d93025':'var(--amber)')+'">'+t+'</span>').join(''):'')+'</td>';
            html += '<td>'+effSpark(r.pre,r.w)+'</td>';
          }
          html += '<td><button class="btn btn-sm" style="font-size:10px;padding:1px 6px;color:var(--red)" onclick="effDelCust(\''+item.id+'\',\''+es(r.n).replace(/'/g,"\\'")+'\')">✕</button></td></tr>';
        });
        html += '</tbody></table></div>';
      }
    }
    html += '</div>';
  });
  return html;
}
function effRestoreFocus(){
  if(!_effFocus) return;
  const inp = document.getElementById(_effFocus);
  if(inp){ inp.focus(); const v = inp.value; inp.value=''; inp.value=v; }
  _effFocus = null;
}
// 统一重渲染入口：当前在「策略」页时刷新策略页，否则刷新兼容列表
function effRerender(){
  const t = document.querySelector('.tab.active');
  if(t && t.dataset.tab === 'strategy') renderStrategy();
  else renderEff();
}
function renderEff(){
  const el = document.getElementById('effContent');
  if(!el) return;
  el.innerHTML = effBoardHtml('flat');
  effRestoreFocus();
}
function effSort(id, key){
  const cur = _effSort[id];
  _effSort[id] = (cur && cur.key===key) ? {key, dir:-cur.dir} : {key, dir:1};
  effRerender();
}
function effSearch(id, val){
  _effFilter[id] = val;
  _effFocus = 'effSearch_' + id;
  effRerender();
}

function effLoadScript(urls){
  return new Promise((resolve, reject)=>{
    let i = 0;
    const tryNext = ()=>{
      if(i >= urls.length){ reject(new Error('所有CDN加载失败')); return; }
      const s = document.createElement('script');
      s.src = urls[i++];
      s.onload = ()=>resolve();
      s.onerror = ()=>{ s.remove(); tryNext(); };
      document.head.appendChild(s);
    };
    tryNext();
  });
}
async function effRunOcr(id){
  const st = document.getElementById('effOcrStatus');
  const setSt = t=>{ const el = document.getElementById('effOcrStatus'); if(el) el.textContent = t; };
  try{
    setSt('加载识别引擎…');
    await effLoadScript([
      'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
      'https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js'
    ]);
    setSt('正在识别海报文字（约10~30秒）…');
    const res = await Tesseract.recognize(_effOcr.img, 'chi_sim', {
      logger: m=>{ if(m.status === 'recognizing text') setSt('正在识别… ' + Math.round(m.progress*100) + '%'); }
    });
    _effOcr.text = res && res.data ? res.data.text : '';
    _effOcr.busy = false;
    effOcrApply(id);
  }catch(err){
    _effOcr.busy = false;
    setSt('⚠️ 自动识别失败（' + (err && err.message ? err.message : '网络/CDN不可用') + '）。请在下方文本框手动输入海报上的客户姓名（每行一个），然后点「从文字提取客户并添加」。');
    effRerender();
  }
}

  const m = effSalesMap();
  return Object.keys(m).filter(n=>norm.includes(n));
}

let _effTable = {entryId:null, busy:false, matched:[], err:''};
function effTableBtn(id){ document.getElementById('effTableFile_'+id).click(); }
function effTableWorkbookText(wb){
  const texts = [];
  (wb.SheetNames||[]).forEach(sn=>{
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:null});
    rows.forEach(r=>{ if(r) r.forEach(c=>{ if(c != null && String(c).trim() !== '') texts.push(String(c)); }); });
  });
  return texts.join('\n');
}
function effTablePick(id, input){
  const f = input.files && input.files[0];
  if(!f) return;
  _effTable = {entryId:id, busy:true, matched:[], err:''};
  effRerender();
  const isCsv = /\.csv$/i.test(f.name);
  const rd = new FileReader();
  rd.onload = async ()=>{
    try{
      if(typeof XLSX === 'undefined'){
        await effLoadScript([
          'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
          'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
          'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
          'https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
        ]);
      }
      const wb = isCsv ? XLSX.read(rd.result, {type:'string'}) : XLSX.read(rd.result, {type:'array'});
      if(!wb.SheetNames || !wb.SheetNames.length) throw new Error('表格中无工作表');
      const allText = effTableWorkbookText(wb);

    }
    effRerender();
  };
  rd.onerror = ()=>{ _effTable.busy = false; _effTable.err = '文件读取失败'; effRerender(); };
  if(isCsv) rd.readAsText(f, 'utf-8'); else rd.readAsArrayBuffer(f);
  input.value = '';

function effParseDateVal(v){
  if(v == null) return null;
  if(v instanceof Date && !isNaN(v)) return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  if(typeof v === 'number' && v > 40000 && v < 60000){
    const ms = Math.round((v - 25569) * 86400000);
    const d = new Date(ms);
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }
  const m = String(v).trim().match(/^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  return null;
}
function effParseXlsx(buf){
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets['基础数据'] || wb.Sheets[Object.keys(wb.Sheets)[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
  let hi = -1, colDate = -1, colHosp = -1, colName = -1, colType = -1, colVal = -1;
  for(let i=0; i<Math.min(rows.length, 10); i++){
    const r = rows[i]; if(!r) continue;
    const at = kw => r.findIndex(c => c != null && String(c).trim() === kw);
    if(at('客户') >= 0 && at('预估') >= 0){
      hi = i; colName = at('客户'); colVal = at('预估');
      colHosp = at('医院'); colType = at('客户类型'); colDate = at('日期');
      break;
    }
  }
  if(hi < 0 || colDate < 0) throw new Error('未找到表头（需含「日期」「客户」「预估」列，且sheet为「基础数据」）');
  const map = {}; let end = -1e9;
  for(let i = hi+1; i < rows.length; i++){
    const r = rows[i]; if(!r) continue;
    const name = r[colName]; if(name == null || !String(name).trim()) continue;
    const dv = effParseDateVal(r[colDate]); if(!dv) continue;
    const idx = Math.round((dv - EFF_BASE) / 86400000);
    if(idx > end) end = idx;
    let v = r[colVal]; v = v == null ? 0 : parseFloat(String(v));
    if(!isFinite(v) || v === 0) continue;
    const n = String(name).trim();
    const o = map[n] || (map[n] = {h:'', t:'', d:{}});
    o.d[idx] = (o.d[idx] || 0) + v;
    if(colHosp >= 0 && r[colHosp] != null && String(r[colHosp]).trim()) o.h = String(r[colHosp]).trim();
    if(colType >= 0 && r[colType] != null && String(r[colType]).trim()) o.t = String(r[colType]).trim();
  }
  if(!Object.keys(map).length) throw new Error('未解析到有效数据行');
  const d = {};
  for(const n in map){
    const o = map[n];
    const ks = Object.keys(o.d).map(Number).sort((a,b)=>a-b);
    d[n] = {h:o.h, t:o.t, d:ks.map(k => k + ':' + (o.d[k] === Math.round(o.d[k]) ? o.d[k] : o.d[k])).join(',')};
  }
  return {d, end};
}

function saveMeeting(){
  const name=document.getElementById('meetingName').value.trim();
  const status=document.getElementById('meetingStatus').value;
  let startDate=document.getElementById('meetingStartDate').value;
  let endDate=document.getElementById('meetingEndDate').value||startDate;
  if(!name){alert('请填写会议名称');return}
  if(status!=='待开展'&&!startDate){alert('请填写开始日期');return}
  if(status==='待开展'){startDate='';endDate='';}
  const editId=document.getElementById('editId').value;
  const type=document.getElementById('meetingType').value;
  const dmList=getMeetingDmChecks();
  let data={name,startDate,endDate,date:startDate,type,dm:dmList,city:document.getElementById('meetingCity').value.trim(),director:document.getElementById('meetingDirector').value.trim(),status,strategy:document.getElementById('meetingStrategy').value,mechanism:document.getElementById('meetingMechanism').value,notes:document.getElementById('meetingNotes').value.trim(),progress:{},_smMig:1};
  if(type==='外部会议'){
    const dmQ={},dmI={};
    // 历史遗留 DM(青岛) 无输入框时按原值只读保留
    const oldExt=(editId!==''&&state.meetings[parseInt(editId)]&&state.meetings[parseInt(editId)].extData)||{};
    const oldQ=oldExt.dmQuota||{},oldI=oldExt.dmInvited||{};
    DM_QUOTA_LIST.map(d=>d.name).concat(DM_LEGACY).forEach(n=>{
      const qEl=document.getElementById('extDmQ_'+n);
      const iEl=document.getElementById('extDmI_'+n);
      const isLegacy=DM_LEGACY.indexOf(n)>=0;
      dmQ[n]=qEl?parseInt(qEl.value)||0:(isLegacy?(oldQ[n]||0):0);
      dmI[n]=iEl?parseInt(iEl.value)||0:(isLegacy?(oldI[n]||0):0);
    });
    const totalQ=Object.keys(dmQ).reduce((s,k)=>s+dmQ[k],0);
    const totalI=Object.keys(dmI).reduce((s,k)=>s+dmI[k],0);
    data.extData={
      dmQuota:dmQ,
      dmInvited:dmI,
      quota:totalQ,
      invited:totalI,
      inviteDeadline:document.getElementById('extInviteDl').value,
      replaceDeadline:document.getElementById('extReplaceDl').value,
      travelDeadline:document.getElementById('extTravelDl').value
    };
  }
  let pmMatch=null,pmBeforeCount=0;
  if(editId===''){
    pmMatch=matchPlannedMeeting(name);
    if(pmMatch)pmBeforeCount=countCreatedSessions(pmMatch);
  }
  if(editId!==''){
    const old=state.meetings[parseInt(editId)];
    data.progress=old.progress||{};data._active=old._active;data.uid=old.uid||generateUID();
    data._smMig=old._smMig||1;   // 保留一次性迁移标记, 避免编辑后被误判为旧数据
    if(old.extData)data.extData=Object.assign({},old.extData,data.extData||{});
    if(old.type!==type){
      const newSop=getSOP(type);const newIds=new Set(newSop.map(n=>n.id));
      const cp={};Object.keys(data.progress).forEach(k=>{if(newIds.has(k))cp[k]=data.progress[k]});
      data.progress=cp;
    }
    state.meetings[parseInt(editId)]=data;
  }else{
    data.uid=generateUID();
    state.meetings.push(data);
  }
  closeModal();saveState();renderMeetingList();renderSummary();renderGantt();renderPlannedMeetings();updatePlannedBadge();
  
  if(pmMatch){
    const pmAfterCount=countCreatedSessions(pmMatch);
    if(pmMatch.totalSessions>1){
      if(pmAfterCount>=pmMatch.totalSessions){
        showToast('🔗 已关联「'+pmMatch.name+'」'+pmAfterCount+'/'+pmMatch.totalSessions+' → 全部场次规划完毕，变更为规划中');
      }else{
        showToast('🔗 已关联「'+pmMatch.name+'」'+pmAfterCount+'/'+pmMatch.totalSessions+'，系列会议保持待开展');
      }
    }else{
      showToast('🔗 已关联「'+pmMatch.name+'」→ 待开展会议变更为规划中');
    }
  }
  
  const newIdx=state.meetings.findIndex(m=>m.uid===data.uid);
  if(newIdx>=0){selectMeeting(newIdx)}
}
function deleteMeeting(idx){
  const m=state.meetings[idx];
  const pm=matchPlannedMeeting(m.name);
  const pmBefore=pm?countCreatedSessions(pm):0;
  if(!confirm('确认删除会议「'+m.name+'」？此操作不可恢复。'))return;
  state.meetings.splice(idx,1);
  saveState();renderMeetingList();renderSummary();renderGantt();renderPlannedMeetings();updatePlannedBadge();
  if(pm&&pmBefore>0){
    const pmAfter=countCreatedSessions(pm);
    if(pmAfter===0){
      showToast('⚠ 会议已删除，「'+pm.name+'」回退为待开展 (0/'+pm.totalSessions+')');
    }else if(pmAfter<pm.totalSessions&&pmBefore>=pm.totalSessions){
      showToast('⚠ 会议已删除，「'+pm.name+'」回退为待开展 ('+pmAfter+'/'+pm.totalSessions+')');
    }
  }
  document.getElementById('progressContent').innerHTML='<div class="empty-state"><div class="icon">📋</div><p>请从左侧选择一场会议</p></div>';
}

  document.getElementById('exportJson').value=JSON.stringify(state,null,2);
}
function downloadBackup(){
  exportData();
  const blob=new Blob([document.getElementById('exportJson').value],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='会议进度备份_'+todayStr()+'.json';a.click();
  URL.revokeObjectURL(url);
  showToast('✅ 备份文件已下载');
}
function copyExport(){exportData();const el=document.getElementById('exportJson');el.select();document.execCommand('copy');showToast('✅ 已复制到剪贴板')}
function importData(){
  try{
    const json=document.getElementById('importJson').value.trim();
    if(!json){alert('请粘贴JSON数据');return}
    const data=JSON.parse(json);
    if(!data.meetings||!Array.isArray(data.meetings)){alert('格式不正确');return}
    if(!confirm(`即将导入 ${data.meetings.length} 场会议、${(data.plannedMeetings||[]).length} 个待开展会议，当前数据将被覆盖。确认？`))return;
    state=data;
    if(!state.plannedMeetings)state.plannedMeetings=[];
    state=normalizeState(state);   // 统一走迁移: 策略/机制兼容 + dm/日期等历史字段补全
    state.meetings.forEach(m=>{if(!m.uid)m.uid=generateUID();if(!m.progress)m.progress={};if(!m.status)m.status='筹备中';if(!m.startDate){if(m.type==='外部会议'&&m.extData&&m.extData.startDate){m.startDate=m.extData.startDate;m.endDate=m.extData.endDate||m.extData.startDate}else if(m.date){m.startDate=m.date;m.endDate=m.date}}if(!m.endDate)m.endDate=m.startDate;if(!m.date)m.date=m.startDate});
    saveState();refreshAll();document.getElementById('progressContent').innerHTML='<div class="empty-state"><div class="icon">📋</div><p>导入完成！请从左侧选择会议</p></div>';
    showToast('✅ 数据导入成功');
  }catch(e){alert('JSON解析失败：'+e.message)}
}
function importFromFile(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    document.getElementById('importJson').value=e.target.result;
    importData();
  };
  reader.readAsText(file);
  event.target.value='';
}
function clearAll(){
  if(!confirm('确认清空所有数据（会议+待开展）？建议先下载备份。'))return;
  state={meetings:[],plannedMeetings:[]};saveState();refreshAll();
  document.getElementById('progressContent').innerHTML='<div class="empty-state"><div class="icon">📋</div><p>数据已清空</p></div>';
  showToast('数据已清空');
}

// ============ Migrate old data ============
function migrateOldData(){
  const oldKey='meeting_progress_data_v2';
  if(localStorage.getItem(oldKey)&&!localStorage.getItem(STORAGE_KEY)){
    try{
      const oldData=JSON.parse(localStorage.getItem(oldKey));
      if(oldData&&oldData.meetings){
        state=oldData;
        if(!state.plannedMeetings)state.plannedMeetings=[];
        state.meetings.forEach(m=>{if(!m.uid)m.uid=generateUID();if(!m.progress)m.progress={};if(!m.status)m.status='筹备中';if(!m.startDate){if(m.type==='外部会议'&&m.extData&&m.extData.startDate){m.startDate=m.extData.startDate;m.endDate=m.extData.endDate||m.extData.startDate}else if(m.date){m.startDate=m.date;m.endDate=m.date}}if(!m.endDate)m.endDate=m.startDate;if(!m.date)m.date=m.startDate});
        saveState(true);
        showToast('🔄 已从旧版迁移数据');
      }
    }catch(e){}
  }
}

// ============ Init ============
// Sidebar toggle
const SIDEBAR_STATE_KEY='sidebar_visible';

function toggleSidebar(){
  const sidebar=document.querySelector('.sidebar');
  const expandBtn=document.getElementById('sidebarExpandBtn');
  const toggleIcon=document.querySelector('.sidebar-toggle');
  if(sidebar.classList.contains('collapsed')){
    sidebar.classList.remove('collapsed');
    expandBtn.classList.remove('show');
    if(toggleIcon)toggleIcon.textContent='◀';
    localStorage.setItem(SIDEBAR_STATE_KEY,'visible');
  }else{
    sidebar.classList.add('collapsed');
    expandBtn.classList.add('show');
    localStorage.setItem(SIDEBAR_STATE_KEY,'collapsed');
  }
}

function restoreSidebarState(){
  const saved=localStorage.getItem(SIDEBAR_STATE_KEY);
  if(saved==='collapsed'){
    document.querySelector('.sidebar').classList.add('collapsed');
    document.getElementById('sidebarExpandBtn').classList.add('show');
  }
}

async function init(){
  await loadState();
  restoreSidebarState();
  migrateOldData();
  if(!state.meetings.length){
    if(restoreAutoBackup()){
      showToast('🔄 已从自动备份恢复数据');
    }
  }
  state.meetings.forEach(m=>{if(!m.uid)m.uid=generateUID();if(!m.startDate&&m.date){m.startDate=m.date;m.endDate=m.date}if(!m.endDate)m.endDate=m.startDate;if(!m.date)m.date=m.startDate});
  saveState(true);
  renderMeetingList();
  renderSummary();
  renderPlannedMeetings();
  updatePlannedBadge();
  updateSyncIndicator('synced');

  // Update current deployment URL in cloud meta (for stale link detection)
  updateCurrentUrl();

  // Local backup every 1 minute
  setInterval(autoBackup,BACKUP_INTERVAL);

  // Data integrity check every 30 seconds
  setInterval(()=>{
    try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw){restoreAutoBackup();refreshAll()}}catch(e){}
  },30000);

  // Save before page closes (real-time backup)
  window.addEventListener('beforeunload',function(){
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
      autoBackup();
      // Best-effort cloud save (jsoneditoronline: PUT body 带 _id + data JSON字符串)
      fetch(CLOUD_API, {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({_id:CLOUD_DOC_ID, name:'meeting-progress', data:JSON.stringify(state)}),
        keepalive:true
      }).catch(()=>{});
    }catch(e){}
  });

  // Sync when tab becomes visible again
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden && passwordVerified){
      cloudLoad().then(serverData=>{
        if(serverData && serverData.meetings){
          const serverHash=JSON.stringify(serverData);
          if(_cloudHash && serverHash!==_cloudHash){
            // 本地有未推送修改时不覆盖，先推送本地最新数据
            if(_localDirty||_cloudSavePending){debouncedCloudSave();return;}
            state=normalizeState(serverData);
            _cloudHash=serverHash;
            localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
            refreshAll();
            showToast('🔄 已从云端同步最新数据');
          }
        }
      });
    }
  });
}

// Don't auto-init - wait for password
</script>
