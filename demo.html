<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会议执行进度看板 · 演示版</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--text:#2c2c2a;--text2:#5f5e5a;--text3:#888780;--border:#d3d1c7;--green:#1d9e75;--green-bg:#e1f5ee;--blue:#185fa5;--blue-bg:#e6f1fb;--amber:#ba7517;--amber-bg:#faeeda;--red:#a32d2d;--red-bg:#fcebeb;--yellow:#f0c929;--yellow-bg:#fff9e6;--purple:#534ab7;--purple-bg:#eeedfe;--orange:#d85a30;--orange-bg:#faece7;--teal:#0e8c80;--teal-bg:#e0f5f3;--radius:10px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;line-height:1.5}
h2{font-size:15px;font-weight:500}h3{font-size:14px;font-weight:500}

/* Demo banner */
.demo-banner{background:linear-gradient(135deg,#534ab7,#185fa5);color:#fff;padding:8px 20px;text-align:center;font-size:12px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:center;gap:8px}
.demo-banner .badge{background:rgba(255,255,255,.2);padding:1px 8px;border-radius:10px;font-size:10px}

.layout{display:flex;height:calc(100vh - 36px)}
.sidebar{width:320px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .25s ease,opacity .25s ease;position:relative}
.sidebar.collapsed{width:0!important;min-width:0!important;overflow:hidden;border-right:none;opacity:0;pointer-events:none}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);position:relative}
.sidebar-toggle{position:absolute;top:8px;right:8px;width:28px;height:28px;border:none;background:none;cursor:pointer;font-size:16px;color:var(--text3);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .15s;z-index:5}
.sidebar-toggle:hover{background:var(--bg);color:var(--text)}
.sidebar-expand-btn{position:fixed;left:8px;top:44px;width:32px;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-size:16px;color:var(--text2);z-index:50;display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.1);transition:all .15s}
.sidebar-expand-btn:hover{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.sidebar-expand-btn.show{display:flex}
.meeting-filter{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.meeting-filter .fbtn{font-size:11px;padding:3px 10px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.meeting-filter .fbtn:hover,.meeting-filter .fbtn.active{border-color:var(--blue);color:#fff;background:var(--blue)}
.meeting-filter .fbtn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.meeting-list{flex:1;overflow-y:auto;padding:8px}
.meeting-card{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;cursor:pointer;transition:all .15s;position:relative}
.meeting-card:hover{border-color:var(--blue);background:var(--blue-bg)}
.meeting-card.active{border-color:var(--blue);border-width:2px;background:var(--blue-bg)}
.meeting-card .name{font-weight:500;font-size:14px}
.meeting-card .meta-row{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;padding:2px 8px;border-radius:12px;display:inline-block;white-space:nowrap}
.tag-offline{background:var(--purple-bg);color:var(--purple)}
.tag-online{background:var(--blue-bg);color:var(--blue)}
.tag-external{background:var(--teal-bg);color:var(--teal)}
.tag-done{background:var(--green-bg);color:var(--green)}
.tag-ongoing{background:var(--blue-bg);color:var(--blue)}
.tag-planning{background:var(--amber-bg);color:var(--amber)}
.progress-mini{height:5px;background:#eee;border-radius:3px;margin-top:6px;overflow:hidden}
.progress-mini-fill{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.badge-warn{position:absolute;top:6px;right:6px;background:var(--yellow);color:var(--text);font-size:10px;padding:1px 6px;border-radius:10px;font-weight:500}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--card);padding:0 20px;flex-shrink:0}
.tab{padding:12px 20px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text2);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab-content{flex:1;overflow-y:auto;padding:20px;display:none}
.tab-content.active{display:block}

.progress-bar-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.progress-bar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.progress-bar-label{font-weight:500}
.progress-bar-pct{font-size:20px;font-weight:500}
.progress-bar-track{height:12px;background:#eee;border-radius:6px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:6px;transition:width .3s}
.pct-high{background:var(--green)}.pct-mid{background:var(--amber)}.pct-low{background:var(--red)}

.phase-section{margin-bottom:16px}
.phase-title{font-size:13px;font-weight:500;margin-bottom:8px;padding:5px 10px;border-radius:6px;display:inline-block}
.phase-pre{background:var(--purple-bg);color:var(--purple)}
.phase-during{background:var(--orange-bg);color:var(--orange)}
.phase-post{background:var(--amber-bg);color:var(--amber)}

.node-grid{display:grid;gap:5px}
.node-row{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;position:relative;user-select:none}
.node-row:hover{border-color:var(--blue)}
.node-row.done{border-color:var(--green);background:var(--green-bg)}
.node-row.overdue{border-color:var(--yellow);border-width:2px;background:var(--yellow-bg)}
.node-row.overdue::after{content:'⚠ 逾期';position:absolute;top:-8px;right:8px;background:var(--yellow);color:var(--text);font-size:10px;padding:1px 6px;border-radius:10px;font-weight:500}
.node-row .node-time{font-size:11px;color:var(--text3);min-width:75px;text-align:right}
.node-row .node-stage{font-weight:500;min-width:120px;font-size:12px}
.node-row .node-task{flex:1;color:var(--text2);font-size:12px}
.node-row .node-owner{font-size:11px;color:var(--text3);min-width:90px;text-align:right}
.node-row .node-deadline{font-size:10px;color:var(--text3);min-width:75px;text-align:right}
.node-status{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.node-status.done{border-color:var(--green);background:var(--green);color:#fff}

.alert-banner{background:var(--yellow-bg);border:1px solid var(--yellow);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px}

/* Gantt */
.gantt-scroll{overflow-x:auto}
.gantt-table{min-width:900px;border-collapse:collapse;font-size:12px;width:100%}
.gantt-table th{text-align:left;padding:8px 10px;background:#f5f5f5;border-bottom:2px solid var(--border);font-weight:500;color:var(--text2);white-space:nowrap}
.gantt-table td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
.gantt-name{font-weight:500;min-width:150px}
.gantt-name small{font-weight:400;color:var(--text3);font-size:11px}
.gantt-bar-wrap{position:relative;height:28px;background:#f0efe9;border-radius:4px;min-width:320px}
.gantt-bar-today{position:absolute;top:-4px;width:2px;height:36px;background:var(--red);z-index:3;border-radius:1px}
.gantt-bar-today::after{content:'今天';position:absolute;top:-16px;left:-14px;font-size:10px;color:var(--red);font-weight:500;white-space:nowrap}
.gantt-bar{position:absolute;top:2px;height:24px;border-radius:3px;display:flex;overflow:hidden}
.gantt-bar .bar-pre{background:var(--purple);opacity:.85;height:100%}
.gantt-bar .bar-during{background:var(--orange);opacity:.85;height:100%}
.gantt-bar .bar-post{background:var(--amber);opacity:.85;height:100%}
.gantt-bar-done{position:absolute;top:2px;height:24px;border-radius:3px 0 0 3px;background:var(--green);opacity:.9;z-index:1}
.gantt-stats{display:flex;gap:6px;flex-wrap:wrap}
.gantt-stat{font-size:11px;padding:3px 8px;border-radius:12px;white-space:nowrap}
.gantt-stat.pre-done{background:var(--purple-bg);color:var(--purple)}
.gantt-stat.overdue{background:var(--yellow-bg);color:var(--amber);font-weight:500}

/* Calendar */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.cal-nav{font-size:18px;background:none;border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:4px 12px;color:var(--text2)}
.cal-nav:hover{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.cal-month-title{font-size:16px;font-weight:500}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.cal-cell{background:var(--card);min-height:80px;padding:4px 6px;font-size:11px}
.cal-cell.other-month{background:#fafaf7}
.cal-cell.weekend{background:#f8f8f5}
.cal-cell .day-num{font-weight:500;margin-bottom:2px;color:var(--text2)}
.cal-cell.weekend .day-num{color:var(--red)}
.cal-cell.today{background:var(--blue-bg)}
.cal-cell.today .day-num{color:var(--blue);font-weight:700}
.cal-event{font-size:10px;padding:1px 4px;border-radius:3px;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.cal-event.offline{background:var(--purple-bg);color:var(--purple)}
.cal-event.online{background:var(--blue-bg);color:var(--blue)}
.cal-event.external{background:var(--teal-bg);color:var(--teal)}

/* Summary */
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-card .label{font-size:12px;color:var(--text3)}
.stat-card .value{font-size:24px;font-weight:500;margin-top:4px}
.stat-card .sub{font-size:12px;color:var(--text2);margin-top:2px}
.table-wrap{overflow-x:auto}
.table-wrap table{width:100%;border-collapse:collapse;font-size:12px}
.table-wrap th{text-align:left;padding:10px 12px;background:#f5f5f5;border-bottom:1px solid var(--border);font-weight:500;color:var(--text2);white-space:nowrap}
.table-wrap td{padding:10px 12px;border-bottom:1px solid var(--border)}
.table-wrap tr:hover td{background:var(--blue-bg)}

.planned-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:8px}
.planned-card .pname{font-weight:500}
.planned-card .pmeta{display:flex;gap:12px;margin-top:4px;font-size:12px;color:var(--text2);flex-wrap:wrap}
.planned-progress{height:6px;background:#eee;border-radius:3px;margin-top:8px;overflow:hidden}
.planned-progress-fill{height:100%;background:var(--blue);border-radius:3px;transition:width .3s}
</style>
</head>
<body>

<div class="demo-banner">
  📋 <strong>会议执行进度看板 · 演示版</strong>
  <span class="badge">DEMO</span>
  <span style="font-size:11px;opacity:.8">模拟数据 · 仅供参考展示</span>
</div>

<div class="layout">

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>📋 会议列表</h2>
    <p>共 <span id="meetingCount">0</span> 场会议</p>
    <button class="sidebar-toggle" onclick="toggleSidebar()" title="收起侧边栏">◀</button>
  </div>
  <div class="meeting-filter">
    <button class="fbtn active" data-filter="" onclick="setFilter('',this)">全部</button>
    <button class="fbtn" data-filter="线下" onclick="setFilter('线下',this)">线下</button>
    <button class="fbtn" data-filter="线上" onclick="setFilter('线上',this)">线上</button>
    <button class="fbtn" data-filter="外部会议" onclick="setFilter('外部会议',this)">外部</button>
  </div>
  <div class="meeting-list" id="meetingList"></div>
</div>

<button class="sidebar-expand-btn" id="sidebarExpand" onclick="toggleSidebar()" title="展开侧边栏">▶</button>

<!-- Main -->
<div class="main">
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="planned" onclick="switchTab('planned')">📅 待开展会议</div>
    <div class="tab" data-tab="sop" onclick="switchTab('sop')">📊 SOP进度看板</div>
    <div class="tab" data-tab="gantt" onclick="switchTab('gantt')">📈 甘特图</div>
    <div class="tab" data-tab="calendar" onclick="switchTab('calendar')">🗓 日历</div>
    <div class="tab" data-tab="summary" onclick="switchTab('summary')">📑 汇总统计</div>
  </div>

  <div class="tab-content active" id="tab-planned"></div>
  <div class="tab-content" id="tab-sop"></div>
  <div class="tab-content" id="tab-gantt"></div>
  <div class="tab-content" id="tab-calendar"></div>
  <div class="tab-content" id="tab-summary"></div>
</div>

</div>

<script>
// ============ SOP Definitions ============
const OFFLINE_SOP = [
  {id:'pre_1',time:'T-60~T-30天',stage:'会议设计',task:'明确会议目标（主要观念、策略、主题、预算）',owner:'LMM&DM',phase:'pre',deadlineDays:-30},
  {id:'pre_2',time:'T-60~T-30天',stage:'会议立项',task:'拉群做内外部沟通（人选、讲题、时间、内容）',owner:'LMM',phase:'pre',deadlineDays:-30},
  {id:'pre_3',time:'T-60~T-30天',stage:'设定会议总监',task:'统筹会议全流程筹备与执行，把控时间节点',owner:'会议总监',phase:'pre',deadlineDays:-30},

  {id:'pre_9',time:'T-7天',stage:'晚宴沟通',task:'确认晚宴名单、时间、地点、行程安排',owner:'LMM&DM',phase:'pre',deadlineDays:-7},

  {id:'pre_14',time:'T-1天',stage:'会前彩排',task:'设备调试、物料摆放、流程彩排',owner:'会议总监&LMM',phase:'pre',deadlineDays:-1},
  {id:'during_1',time:'D-DAY',stage:'坚守岗位各司其职',task:'做好会议记录与总结，确保客户全程参会',owner:'ALL',phase:'during',deadlineDays:0},
  {id:'post_1',time:'T+3天',stage:'会后复盘',task:'全员复盘，设定TTH目标及行动计划',owner:'DM',phase:'post',deadlineDays:3},
  {id:'post_2',time:'T+7天',stage:'持续跟进',task:'跟进会后四周TTH进展',owner:'LMM',phase:'post',deadlineDays:7}
];

const ONLINE_SOP = [
  {id:'pre_1',time:'T-60~T-30天',stage:'会议设计',task:'明确会议目标（主要观念、策略、主题、预算）',owner:'LMM&DM',phase:'pre',deadlineDays:-30},

  {id:'pre_4',time:'T-14天',stage:'会议出版定型',task:'确认初版日程、串场等细节',owner:'会议总监',phase:'pre',deadlineDays:-14},

  {id:'pre_10',time:'T-2天',stage:'会前沟通会',task:'确认分工落地，协调筹备问题',owner:'LMM',phase:'pre',deadlineDays:-2},
  {id:'pre_11',time:'T-7~T-1天',stage:'参会嘉宾沟通',task:'每天统计嘉宾出席情况',owner:'会议总监',phase:'pre',deadlineDays:-1},
  {id:'pre_12',time:'T-1天',stage:'会前最终确认',task:'嘉宾交通、最终出席人员',owner:'会议总监',phase:'pre',deadlineDays:-1},

  {id:'during_2',time:'D-DAY',stage:'坚守岗位各司其职',task:'线上互动、录制、会议记录',owner:'ALL',phase:'during',deadlineDays:0},

const EXTERNAL_SOP = [
  {id:'ext_invite',time:'自定义',stage:'专家邀请',task:'按分配名额完成专家邀请，确认参会名单',owner:'DM',phase:'pre',customDeadline:true},
  {id:'ext_replace',time:'自定义',stage:'专家替换',task:'完成专家替换确认，锁定最终参会专家',owner:'DM',phase:'pre',customDeadline:true},
  {id:'ext_travel',time:'自定义',stage:'行程收集',task:'收集确认专家行程信息（交通/住宿）',owner:'DM',phase:'pre',customDeadline:true}
];

function getSOP(type){
  if(type==='线上')return ONLINE_SOP;
  if(type==='外部会议')return EXTERNAL_SOP;
  return OFFLINE_SOP;
}

// ============ Mock Data ============
const TODAY = new Date('2026-08-11');

function genUID(){return 'm_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)}

const DEMO_MEETINGS = [

// ============ Helpers ============
function parseDate(d){if(!d)return null;const parts=d.split('-');return new Date(+parts[0],+parts[1]-1,+parts[2])}
function fmtDate(d){if(!d)return'';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDateRange(m){const s=m.startDate||m.date||'',e=m.endDate||m.startDate||m.date||'';if(!s)return'未设置';return s===e?s:s+' ~ '+e}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function daysBetween(a,b){return Math.floor((b-a)/(1000*60*60*24))}

function getSopNodeDeadline(m,node){
  const sd=parseDate(m.startDate||m.date);if(!sd)return null;
  if(node.customDeadline){
    const keyMap={ext_invite:'inviteDeadline',ext_replace:'replaceDeadline',ext_travel:'travelDeadline'};
    const key=keyMap[node.id];if(!key||!m.extData||!m.extData[key])return null;
    return parseDate(m.extData[key]);
  }
  return addDays(sd,node.deadlineDays);
}

function getMeetingProgress(m){
  const sop=getSOP(m.type);if(!sop.length)return{t:0,d:0,pct:0,overdue:0,preT:0,preD:0,durT:0,durD:0,postT:0,postD:0,overdueNodes:[]};
  let t=0,d=0,overdue=0,preT=0,preD=0,durT=0,durD=0,postT=0,postD=0;
  const overdueNodes=[];
  const start=parseDate(m.startDate||m.date);
  sop.forEach(node=>{
    t++;const phase=node.phase||'pre';
    if(phase==='pre')preT++;else if(phase==='during')durT++;else postT++;
    const status=m.progress[node.id]||'pending';
    if(status==='done'){d++;if(phase==='pre')preD++;else if(phase==='during')durD++;else postD++;}
    if(status!=='done'){
      const dl=getSopNodeDeadline(m,node);
      if(dl&&start&&TODAY>dl){overdue++;overdueNodes.push(node);}
    }
  });
  return{t,d,pct:t?Math.round(d/t*100):0,overdue,preT,preD,durT,durD,postT,postD,overdueNodes};
}

function getPlannedProgress(p){
  const total=p.count||1;
  let created=0;
  state.meetings.forEach(m=>{if((m.name||'').includes(p.name))created++});
  return Math.min(created,total);
}

  </div>`;

  if(p.overdue>0){

  }

  // Phase groups
  const phases=[{key:'pre',label:'会前筹备',cls:'phase-pre'},{key:'during',label:'会中执行',cls:'phase-during'},{key:'post',label:'会后跟进',cls:'phase-post'}];
  phases.forEach(phase=>{
    const nodes=sop.filter(n=>(n.phase||'pre')===phase.key);
    if(!nodes.length)return;
    html+=`<div class="phase-section">
      <div class="phase-title ${phase.cls}">${phase.label}</div>
      <div class="node-grid">`;
    nodes.forEach(node=>{
      const status=m.progress[node.id]||'pending';
      const cls=status==='done'?'done':'';
      const isOverdue=status!=='done'&&p.overdueNodes.some(n=>n.id===node.id);
      const overdueCls=isOverdue?' overdue':'';
      const dl=getSopNodeDeadline(m,node);
      const dlStr=dl?fmtDate(dl):node.time;
      html+=`<div class="node-row ${cls}${overdueCls}" onclick="toggleNode('${m.uid}','${node.id}')" title="点击切换状态">

        <span class="node-time">${node.time}</span>
        <span class="node-stage">${node.stage}</span>
        <span class="node-task">${node.task}</span>
        <span class="node-owner">👤 ${node.owner}</span>
        <span class="node-deadline">📅 ${dlStr}</span>

  });

    html+=`<div class="phase-section">

      <div style="background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden">

    const dmNames=['张明华','李思远','王建国','陈志强','赵大伟','刘小燕','待分配'];
    let tQ=0,tI=0;
    dmNames.forEach(dm=>{
      const q=m.extData.dmQuota[dm]||0;
      const inv=m.extData.dmInvited[dm]||0;
      tQ+=q;tI+=inv;
      if(q===0&&inv===0)return;

        <td style="padding:8px 12px"><div class="progress-mini" style="margin:0"><div class="progress-mini-fill" style="width:${pct}%"></div></div></td>

    html+='</table></div></div>';
  }

  el.innerHTML=html;
}

// ============ Gantt ============
function renderGantt(){
  const el=document.getElementById('tab-gantt');
  const meetings=state.meetings.filter(m=>m.status!=='已完成');
  if(!meetings.length){el.innerHTML='<div style="padding:40px;text-align:center;color:var(--text3)">暂无进行中的会议</div>';return;}

  // Calculate date range: min(start-60) to max(end+7)
  const allStarts=meetings.map(m=>parseDate(m.startDate||m.date)).filter(Boolean);
  if(!allStarts.length){el.innerHTML='<div style="padding:40px;text-align:center;color:var(--text3)">请先设置会议日期</div>';return;}
  const minDate=new Date(Math.min(...allStarts));minDate.setDate(minDate.getDate()-60);
  const allEnds=meetings.map(m=>parseDate(m.endDate||m.startDate||m.date)).filter(Boolean);
  const maxDate=new Date(Math.max(...allEnds));maxDate.setDate(maxDate.getDate()+7);
  const totalDays=daysBetween(minDate,maxDate)+1;
  const todayOffset=daysBetween(minDate,TODAY);
  const dayWidth=Math.max(3,Math.floor(280/totalDays));

  // Sort by overdue count desc, then start date asc
  const sortedM=[...meetings].sort((a,b)=>{
    const pa=getMeetingProgress(a),pb=getMeetingProgress(b);
    if(pb.overdue!==pa.overdue)return pb.overdue-pa.overdue;
    return parseDate(a.startDate)-parseDate(b.startDate);
  });

  let html='<div style="max-height:calc(100vh-200px);overflow-y:auto">';
  html+='<table class="gantt-table"><thead><tr><th>会议</th><th>进度统计</th><th>时间线</th></tr></thead><tbody>';

  sortedM.forEach(m=>{
    const p=getMeetingProgress(m);
    const sd=parseDate(m.startDate||m.date);
    const ed=parseDate(m.endDate||m.startDate||m.date);
    if(!sd)return;
    const startOff=daysBetween(minDate,sd);
    const durOff=daysBetween(sd,ed)+1;
    const barLen=Math.max(60,durOff*dayWidth);
    const donePct=p.t?p.d/p.t:0;

    html+=`<tr><td class="gantt-name">${m.name}<br><small>${fmtDateRange(m)} · ${m.dm}</small></td><td><div class="gantt-stats">`;
    if(p.preD>0)html+=`<span class="gantt-stat pre-done">会前 ${p.preD}/${p.preT}</span>`;
    if(p.durD>0)html+=`<span class="gantt-stat" style="background:var(--orange-bg);color:var(--orange)">会中 ${p.durD}/${p.durT}</span>`;
    if(p.postD>0)html+=`<span class="gantt-stat" style="background:var(--amber-bg);color:var(--amber)">会后 ${p.postD}/${p.postT}</span>`;
    if(p.overdue>0)html+=`<span class="gantt-stat overdue">⚠ ${p.overdue}逾期</span>`;
    html+=`</div></td><td><div class="gantt-bar-wrap" style="min-width:320px">`;

    // Today line
    if(todayOffset>=0&&todayOffset<=totalDays){
      html+=`<div class="gantt-bar-today" style="left:${todayOffset*dayWidth}px"></div>`;
    }

    // Bar (pre/during/post phases)
    const preDays=Math.max(0,Math.min(60,daysBetween(addDays(sd,-60),sd)));
    const duringDays=durOff;
    const postDays=7;
    const preW=preDays*dayWidth,durW=duringDays*dayWidth,postW=postDays*dayWidth;
    const barStart=startOff<60?startOff*dayWidth:0;

    html+=`<div class="gantt-bar" style="left:${Math.max(0,startOff-preDays)*dayWidth}px;width:${preW+durW+postW}px">`;
    html+=`<div class="bar-pre" style="width:${preW}px"></div>`;
    html+=`<div class="bar-during" style="width:${durW}px"></div>`;
    html+=`<div class="bar-post" style="width:${postW}px"></div>`;
    html+='</div>';

    // Done overlay
    if(donePct>0){
      html+=`<div class="gantt-bar-done" style="left:${Math.max(0,(startOff-preDays)*dayWidth)}px;width:${(preW+durW+postW)*donePct}px"></div>`;
    }

    // Milestones
    const sop=getSOP(m.type);
    sop.forEach(node=>{
      const dl=getSopNodeDeadline(m,node);
      if(!dl)return;
      const off=daysBetween(minDate,dl);
      if(off<0||off>totalDays)return;
      const isDone=m.progress[node.id]==='done';
      const isLate=!isDone&&TODAY>dl;
      html+=`<div class="gantt-milestone${isLate?' late':''}" style="left:${off*dayWidth}px" title="${node.stage}${isLate?' · 逾期':''}"></div>`;
    });

    html+='</div></td></tr>';
  });

  html+='</tbody></table>';
  html+='<div style="padding:12px;display:flex;gap:20px;font-size:11px;flex-wrap:wrap">';
  html+='<span><span style="display:inline-block;width:12px;height:12px;background:var(--purple);border-radius:2px;vertical-align:middle;margin-right:4px;opacity:.85"></span>会前</span>';
  html+='<span><span style="display:inline-block;width:12px;height:12px;background:var(--orange);border-radius:2px;vertical-align:middle;margin-right:4px;opacity:.85"></span>会中</span>';
  html+='<span><span style="display:inline-block;width:12px;height:12px;background:var(--amber);border-radius:2px;vertical-align:middle;margin-right:4px;opacity:.85"></span>会后</span>';
  html+='<span><span style="display:inline-block;width:12px;height:12px;background:var(--green);border-radius:2px;vertical-align:middle;margin-right:4px;opacity:.9"></span>已完成</span>';
  html+='<span><span style="display:inline-block;width:2px;height:12px;background:var(--yellow);border-radius:1px;vertical-align:middle;margin-right:4px"></span>逾期里程碑</span>';
  html+='<span><span style="display:inline-block;width:2px;height:12px;background:var(--red);border-radius:1px;vertical-align:middle;margin-right:4px"></span>今天</span>';
  html+='</div></div>';
  el.innerHTML=html;
}

// ============ Calendar ============
function renderCalendar(){
  const el=document.getElementById('tab-calendar');
  const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth();
  const firstDay=new Date(y,m,1);
  const lastDay=new Date(y,m+1,0);
  const startPad=(firstDay.getDay()+6)%7; // Monday start
  const totalCells=startPad+lastDay.getDate();
  const weeks=Math.ceil(totalCells/7);
  const totalSlots=weeks*7;

  // Build event map: date string -> [{name,type}]
  const eventMap={};
  state.meetings.forEach(meeting=>{
    const sd=parseDate(meeting.startDate||meeting.date);
    const ed=parseDate(meeting.endDate||meeting.startDate||meeting.date);
    if(!sd)return;
    const end=ed||sd;
    for(let d=new Date(sd);d<=end;d.setDate(d.getDate()+1)){
      const key=fmtDate(d);
      if(!eventMap[key])eventMap[key]=[];
      eventMap[key].push({name:meeting.name,dm:meeting.dm,type:meeting.type});
    }
  });

  const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const dayHeaders=['一','二','三','四','五','六','日'];

  let html=`<div class="cal-header">
    <button class="cal-nav" onclick="changeMonth(-1)">◀</button>
    <span class="cal-month-title">${y}年 ${monthNames[m]}</span>
    <button class="cal-nav" onclick="changeMonth(1)">▶</button>
  </div>`;

  html+='<div class="cal-grid">';
  // Day headers
  dayHeaders.forEach((d,i)=>{html+=`<div style="background:var(--card);padding:6px;text-align:center;font-size:11px;font-weight:500;color:${i>=5?'var(--red)':'var(--text2)'}">${d}</div>`});

  for(let i=0;i<totalSlots;i++){
    const dayNum=i-startPad+1;
    const isOther=dayNum<1||dayNum>lastDay.getDate();
    const date=new Date(y,m,dayNum);
    const dateKey=fmtDate(date);
    const isToday=dateKey===fmtDate(TODAY);
    const dow=(i%7);
    const isWeekend=dow>=5;

    let cls='cal-cell';
    if(isOther)cls+=' other-month';
    if(isWeekend)cls+=' weekend';
    if(isToday)cls+=' today';

    html+=`<div class="${cls}">`;
    if(!isOther){
      html+=`<div class="day-num">${dayNum}</div>`;
      const events=eventMap[dateKey]||[];
      events.forEach(ev=>{
        const typeCls=ev.type==='线下'?'offline':ev.type==='线上'?'online':'external';
        html+=`<div class="cal-event ${typeCls}" title="${ev.name} · ${ev.dm}">${ev.name}</div>`;
      });
    }
    html+='</div>';
  }
  html+='</div>';

  // Legend
  html+='<div style="margin-top:12px;display:flex;gap:16px;font-size:11px;flex-wrap:wrap">';
  html+='<span><span class="cal-event offline" style="display:inline-block;width:20px;vertical-align:middle;margin-right:4px">&nbsp;</span>线下会议</span>';
  html+='<span><span class="cal-event online" style="display:inline-block;width:20px;vertical-align:middle;margin-right:4px">&nbsp;</span>线上会议</span>';
  html+='<span><span class="cal-event external" style="display:inline-block;width:20px;vertical-align:middle;margin-right:4px">&nbsp;</span>外部会议</span>';
  html+='</div>';

  el.innerHTML=html;
}

function changeMonth(delta){
  calendarMonth.setMonth(calendarMonth.getMonth()+delta);
  renderCalendar();
}

// ============ Summary ============
function renderSummary(){
  const el=document.getElementById('tab-summary');
  const meetings=state.meetings;
  const total=meetings.length;
  const done=meetings.filter(m=>m.status==='已完成').length;
  const ongoing=meetings.filter(m=>m.status==='进行中').length;
  const planning=meetings.filter(m=>m.status==='筹备中').length;
  const totalOverdue=meetings.reduce((s,m)=>s+getMeetingProgress(m).overdue,0);
  const offline=meetings.filter(m=>m.type==='线下').length;
  const online=meetings.filter(m=>m.type==='线上').length;
  const ext_=meetings.filter(m=>m.type==='外部会议').length;

  let html=`<div class="summary-row">
    <div class="stat-card"><div class="label">会议总数</div><div class="value">${total}</div><div class="sub">线下${offline} · 线上${online} · 外部${ext_}</div></div>
    <div class="stat-card"><div class="label">已完成</div><div class="value" style="color:var(--green)">${done}</div><div class="sub">占比 ${Math.round(done/total*100)}%</div></div>
    <div class="stat-card"><div class="label">进行中</div><div class="value" style="color:var(--blue)">${ongoing}</div><div class="sub">筹备中 ${planning} 场</div></div>
    <div class="stat-card"><div class="label">总逾期节点</div><div class="value" style="color:var(--red)">${totalOverdue}</div><div class="sub">需立即处理</div></div>
  </div>`;

  // Detail table
  html+='<h3 style="margin-bottom:12px">📊 会议明细汇总</h3><div class="table-wrap"><table><thead><tr>';
  ['会议名称','类型','DM','日期','状态','总节点','已完成','逾期','进度'].forEach(h=>{html+=`<th>${h}</th>`});
  html+='</tr></thead><tbody>';

  meetings.forEach(m=>{
    const p=getMeetingProgress(m);
    const typeLabel=m.type==='线下'?'线下':m.type==='线上'?'线上':'外部';
    const typeCls=m.type==='线下'?'var(--purple)':m.type==='线上'?'var(--blue)':'var(--teal)';
    const statusCls=m.status==='已完成'?'var(--green)':m.status==='进行中'?'var(--blue)':'var(--amber)';
    html+=`<tr onclick="selectMeeting('${m.uid}');switchTab('sop')" style="cursor:pointer">
      <td style="font-weight:500">${m.name}</td>
      <td><span style="color:${typeCls};font-weight:500">${typeLabel}</span></td>
      <td>${m.dm}</td>
      <td style="font-size:11px">${fmtDateRange(m)}</td>
      <td><span style="color:${statusCls};font-weight:500">${m.status}</span></td>
      <td>${p.t}</td>
      <td>${p.d} (${p.pct}%)</td>
      <td style="color:${p.overdue>0?'var(--red)':'var(--text3)'}">${p.overdue>0?'⚠ '+p.overdue:'✓ 0'}</td>
      <td><div class="progress-mini" style="margin:0"><div class="progress-mini-fill" style="width:${p.pct}%"></div></div></td>
    </tr>`;
  });

  html+='</tbody></table></div>';
  html+='<div style="margin-top:12px;font-size:11px;color:var(--text3)">💡 点击任意行可跳转到该会议的SOP进度看板</div>';
  el.innerHTML=html;
}

// ============ Init ============
function init(){
  renderMeetingList();
  renderPlanned();
}

init();
</script>
